[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hefesto"
version = "1.0.0"
description = "Hefesto - a surrogate-model forge for regression on ANSYS semiconductor packaging simulations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcos Antonio Colares Brasil Filho" }]
keywords = [
    "surrogate model",
    "regression",
    "machine learning",
    "ansys",
    "semiconductor packaging",
    "reliability",
    "hyperparameter optimization",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "altair>=5"]
catboost = ["catboost>=1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
hefesto = "hefesto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
